  "subject": "Terceiro Setor",
  "question": "A Associação Vida Plena, qualificada como OSCIP, pretende formalizar com o Ministério da Saúde um vínculo de cooperação para o fomento e a execução de atividades de interesse público. O instrumento adequado a essa parceria é o termo de parceria, ao passo que o contrato de gestão é o instrumento próprio das organizações sociais.",
  "answer": "CERTO",
  "justification": "O instrumento muda conforme a qualificação, e o material destaca que esse é um tópico frequentemente cobrado em provas. A OSCIP firma TERMO DE PARCERIA. A OS firma CONTRATO DE GESTÃO.\n\nArt. 9º, Lei 9.790/99: \"Fica instituído o Termo de Parceria, assim considerado o instrumento passível de ser firmado entre o Poder Público e as entidades qualificadas como Organizações da Sociedade Civil de Interesse Público destinado à formação de vínculo de cooperação entre as partes, para o fomento e a execução das atividades de interesse público previstas no art. 3º desta Lei.\"\n\nArt. 5º, Lei 9.637/98: \"Para os efeitos desta Lei, entende-se por contrato de gestão o instrumento firmado entre o Poder Público e a entidade qualificada como organização social, com vistas à formação de parceria entre as partes para fomento e execução de atividades relativas às áreas relacionadas no art. 1º.\""

 {
  "id": 7,
  "subject": "Terceiro Setor",
  "question": "Um fornecedor pretende cobrar judicialmente uma dívida do SESI (Serviço Social da Indústria). A ação deve ser proposta na Justiça Estadual, e o SESI litiga como pessoa jurídica de direito privado comum, sem os privilégios processuais da Fazenda Pública.",

const KEY = "fc_terceiro_setor_v1";
let state;
try { state = JSON.parse(localStorage.getItem(KEY)) || null; } catch(e) { state = null; }
if (!state) state = {session: 0, cards: {}, stats: {ok: 0, idk: 0, bad: 0}};
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} }
function cs(id){ if(!state.cards[id]) state.cards[id] = {interval: 1, due: 0}; return state.cards[id]; }
let subject = "ALL", current = null, last = undefined;
const subjects = [...new Set(RAW.map(c => c.subject))];

function pool(){ return RAW.filter(c => subject === "ALL" || c.subject === subject).map(c => c.id); }
function dueCards(){ return pool().filter(id => cs(id).due <= state.session); }
function pickNext(exclude){
  let due = dueCards();
  if (exclude !== undefined) due = due.filter(id => id !== exclude);
  if (!due.length) return null;
  due.sort((a,b) => cs(a).due - cs(b).due);
  const n = Math.min(5, due.length);
  return due[Math.floor(Math.random()*n)];
}
function renderFilters(){
  const f = document.getElementById("filters"); f.innerHTML = "";
  [["ALL","Todas as matérias"], ...subjects.map(s => [s,s])].forEach(([v,l]) => {
    const b = document.createElement("button"); b.textContent = l;
    if (v === subject) b.className = "on";
    b.onclick = () => { subject = v; last = undefined; next(); renderFilters(); };
    f.appendChild(b);
  });
}
function renderStats(){
  document.getElementById("sOk").textContent = state.stats.ok;
  document.getElementById("sIdk").textContent = state.stats.idk;
  document.getElementById("sBad").textContent = state.stats.bad;
  const ids = pool(), mastered = ids.filter(id => cs(id).interval >= 10).length;
  document.getElementById("bar").style.width = (ids.length ? mastered/ids.length*100 : 0) + "%";
  document.getElementById("barlbl").textContent = mastered + " de " + ids.length + " cards dominados";
  document.getElementById("info").textContent = dueCards().length + " disponíveis para revisão";
}
function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text !== undefined) e.textContent = text; return e; }
function showFront(){
  const c = RAW[current], box = document.getElementById("card"); box.innerHTML = "";
  box.appendChild(el("div","tag",c.subject + " · card " + (c.id+1)));
  box.appendChild(el("div","q",c.question));
  const b = el("button","primary","Ver resposta"); b.onclick = showBack; box.appendChild(b);
}
function showBack(){
  const c = RAW[current], box = document.getElementById("card"); box.innerHTML = "";
  box.appendChild(el("div","tag",c.subject + " · card " + (c.id+1)));
  box.appendChild(el("div","q",c.question));
  box.appendChild(el("div","verdict " + c.answer, c.answer === "CERTO" ? "Gabarito: CERTO ✅" : "Gabarito: ERRADO ❌"));
  box.appendChild(el("div","just",c.justification));
  const row = el("div","answers");
  [["ok","b-ok","✅ Acertei"],["idk","b-idk","🤔 Não sei"],["bad","b-bad","❌ Errei"]].forEach(([k,cls,t]) => {
    const b = el("button",cls,t); b.onclick = () => answer(k); row.appendChild(b);
  });
  box.appendChild(row);
}
function answer(kind){
  const s = cs(current);
  if (kind === "ok") s.interval = s.interval * 2.5;
  else if (kind === "bad") s.interval = 1;
  else s.interval = s.interval * 0.6;
  s.interval = Math.round(s.interval*100)/100;
  state.stats[kind]++;
  state.session += 1;
  s.due = state.session + s.interval;
  last = current; save(); next();
}
function next(){
  renderStats();
  current = pickNext(last);
  if (current === null && last !== undefined) current = pickNext(undefined);
  const box = document.getElementById("card");
  if (current === null){
    box.innerHTML = ""; box.className = "card empty";
    box.appendChild(el("p","","Nenhum card disponível agora."));
    const b = el("button","primary","Revisar mesmo assim");
    b.onclick = () => { const ids = pool(); state.session = Math.min(...ids.map(id => cs(id).due)); save(); next(); };
    box.appendChild(b); return;
  }
  box.className = "card"; showFront();
}
document.getElementById("reset").onclick = () => {
  if (confirm("Zerar todo o progresso?")) { state = {session:0,cards:{},stats:{ok:0,idk:0,bad:0}}; save(); last = undefined; next(); }
};
renderFilters(); next();
</script>
